name: Deploy ke Netlify

# Auto-deploy: setiap push ke branch main, situs adwaveyt.netlify.app
# langsung diperbarui. Tidak perlu drag-drop atau buka dashboard lagi.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy ke Netlify (produksi)
        run: npx --yes netlify-cli@27 deploy --prod --dir . --message "Auto-deploy dari GitHub ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
